name: Context experiment

on:
  push:
  pull_request:

jobs:
  show-context:
    runs-on: ubuntu-latest

    steps:
      - name: Show context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"