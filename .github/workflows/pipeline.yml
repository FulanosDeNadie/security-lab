name: CI Pipeline

on:
  push:
  pull_request:

env:
  ENVIRONMENT: productio
  PROJECT_NAME: security-lab

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  security:
    runs-on: ubuntu-latest

    outputs:
      security-result: ${{ steps.security-check.outputs.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check workflow files
        run: |
          echo "Checking GitHub Actions workflows..."
          find .github/workflows -type f -name "*.yml" -o -name "*.yaml"

      - name: Generate security result
        id: security-check
        run: echo "result=FAIL" >> "$GITHUB_OUTPUT"
  
  
  gate:
    needs:
      - test
      - security

    runs-on: ubuntu-latest

    steps:
      - name: Gate
        if: github.event_name == 'pull_request'
        run: echo "All checks passed"

      - name: Show security result
        run: 'echo "Security result: ${{ needs.security.outputs.security-result }}"'
    