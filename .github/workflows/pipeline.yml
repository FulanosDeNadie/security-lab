name: CI Pipeline

on:
  push:
  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Run tests
        run: echo "Tests passed"

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Run security check
        run: |
              echo "Security check failed"
              exit 1

  gate:
    needs:
      - test
      - security

    runs-on: ubuntu-latest

    steps:
      - name: Final gate
        run: echo "All checks passed - pipeline can continue"