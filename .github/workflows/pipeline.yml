name: CI Pipeline

on:
  push:
  pull_request:

env:
  ENVIRONMENT: productio
  PROJECT_NAME: security-lab

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: echo "Tests passed"

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Security check
        if: github.event_name == 'pull_request'
        run: echo "Security check passed"
  
  
  gate:
    needs:
      - test
      - security

    runs-on: ubuntu-latest

    steps:
      - name: Gate
        if: github.event_name == 'pull_request'
        run: echo "All checks passed"