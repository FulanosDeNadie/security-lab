name: CI Pipeline

on:
  push:
  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: ls -la

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Run security check
        run: echo "Security check passed"

  gate:
    needs:
      - test
      - security

    runs-on: ubuntu-latest

    steps:
      - name: Final gate
        run: echo "All checks passed - pipeline can continue"