name: Trigger experiment

on:
  push:
  pull_request: 
    types: [opened]

jobs:
  trigger-test:
    runs-on: ubuntu-latest

    steps:
      - name: Show context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
