name: PR target experiment

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Show context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"

      - name: Checkout default code
        uses: actions/checkout@v4

      - name: Show checked out commit
        run: |
          git rev-parse HEAD
          git status