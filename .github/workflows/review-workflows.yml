name: Workflow security review

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-security-review
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run Zizmor
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read # Required by Zizmor to inspect GitHub Actions metadata
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: true
          persona: pedantic

  report:
    name: Report Zizmor findings
    runs-on: ubuntu-latest
    needs: zizmor

    if: github.event_name == 'pull_request'

    permissions:
      security-events: read
      issues: write
      pull-requests: write

    steps:
      - name: Report Zizmor findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          echo "Reading Zizmor alerts for PR #${PR_NUMBER}..."

          alerts=$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GH_REPO}/code-scanning/alerts?pr=${PR_NUMBER}&tool_name=zizmor&state=open&per_page=100")

          count=$(echo "$alerts" | jq 'length')

          echo "Found ${count} open Zizmor alert(s)."

          # ------------------------------------------------------------------
          # Build report
          # ------------------------------------------------------------------

          body="## 🔐 Zizmor Security Review

          "

          if [ "$count" -eq 0 ]; then

            body+="**0 findings · 0 blocking · 0 warnings**

          "
            body+="### Merge status

          "
            body+="✅ **NOT BLOCKED**

          "
            body+="No open Zizmor findings were detected for this pull request."

          else

            blocking=0
            warnings=0
            info=0

            blocking_section=""
            warning_section=""
            info_section=""

            while IFS= read -r finding; do

              rule=$(echo "$finding" | jq -r '.rule.id // .rule.name // "unknown"')
              severity=$(echo "$finding" | jq -r '.rule.severity // "unknown"')
              file=$(echo "$finding" | jq -r '.most_recent_instance.location.path // "unknown"')
              line=$(echo "$finding" | jq -r '.most_recent_instance.location.start_line // "?"')
              html_url=$(echo "$finding" | jq -r '.html_url')

              severity_upper=$(echo "$severity" | tr '[:lower:]' '[:upper:]')

              case "$severity_upper" in

                ERROR|HIGH|CRITICAL)
                  blocking=$((blocking + 1))

                  blocking_section+="
          - \`${rule}\`
            \`${file}:${line}\` · [details](${html_url})
          "
                  ;;

                WARNING|MEDIUM|LOW)
                  warnings=$((warnings + 1))

                  warning_section+="
          - \`${rule}\`
            \`${file}:${line}\` · [details](${html_url})
          "
                  ;;

                NOTE|INFO)
                  info=$((info + 1))

                  info_section+="
          - \`${rule}\`
            \`${file}:${line}\` · [details](${html_url})
          "
                  ;;

                *)
                  info=$((info + 1))

                  info_section+="
          - \`${rule}\`
            \`${file}:${line}\` · [details](${html_url})
          "
                  ;;

              esac

            done < <(echo "$alerts" | jq -c '.[]')

            body+="**${count} findings · ${blocking} blocking · ${warnings} warnings · ${info} informational**

          "

            if [ "$blocking" -gt 0 ]; then

              body+="---

          "
              body+="### 🔴 Blocking

          "
              body+="${blocking_section}"

            fi

            if [ "$warnings" -gt 0 ]; then

              body+="---

          "
              body+="### ⚠️ Warnings

          "
              body+="${warning_section}"

            fi

            if [ "$info" -gt 0 ]; then

              body+="---

          "
              body+="### ℹ️ Informational

          "
              body+="${info_section}"

            fi

            body+="---

          "
            body+="### Merge status

          "

            if [ "$blocking" -gt 0 ]; then

              body+="❌ **BLOCKED**

          "
              body+="At least one High/Critical finding requires remediation."

            else

              body+="✅ **NOT BLOCKED**

          "
              body+="No High/Critical findings were detected."

            fi

            body+="

          > **Policy:** High/Critical findings block the merge. Medium/Low findings are warnings."

          fi

          echo "----- Comment body -----"
          printf '%s\n' "$body"
          echo "------------------------"

          # ------------------------------------------------------------------
          # Create PR comment
          # ------------------------------------------------------------------

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$body"