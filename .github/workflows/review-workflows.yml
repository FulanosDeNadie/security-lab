name: Workflow security review

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-security-review
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run Zizmor
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: true
          persona: pedantic

  report:
    name: Report security findings
    runs-on: ubuntu-latest
    needs: zizmor

    if: github.event_name == 'pull_request'

    permissions:
      security-events: read
      issues: write

    steps:
      - name: Report Zizmor findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          echo "Reading Zizmor alerts for PR #${PR_NUMBER}..."

          alerts=$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GH_REPO}/code-scanning/alerts?pr=${PR_NUMBER}&tool_name=zizmor&state=open&per_page=100")

          count=$(echo "$alerts" | jq 'length')

          echo "Found ${count} open Zizmor alert(s)."

          body="## 🔐 Zizmor security review

          "

          if [ "$count" -eq 0 ]; then
            body="${body}No open Zizmor findings were detected for this pull request.

          **Merge status:** ✅ **NOT BLOCKED**"
          else
            blocking=0
            warnings=0

            while IFS= read -r finding; do
              number=$(echo "$finding" | jq -r '.number')
              rule=$(echo "$finding" | jq -r '.rule.id // .rule.name // "unknown"')
              severity=$(echo "$finding" | jq -r '.rule.severity // "unknown"')
              description=$(echo "$finding" | jq -r '.rule.description // "No description available."')
              file=$(echo "$finding" | jq -r '.most_recent_instance.location.path // "unknown"')
              line=$(echo "$finding" | jq -r '.most_recent_instance.location.start_line // "?"')
              html_url=$(echo "$finding" | jq -r '.html_url')

              severity_upper=$(echo "$severity" | tr '[:lower:]' '[:upper:]')

              case "$severity_upper" in
                ERROR|HIGH|CRITICAL)
                  status="🔴 BLOCKING"
                  blocking=$((blocking + 1))
                  ;;
                WARNING|MEDIUM|LOW|NOTE)
                  status="🟡 WARNING"
                  warnings=$((warnings + 1))
                  ;;
                *)
                  status="⚪ INFO"
                  ;;
              esac

              body="${body}### ${status} — ${severity_upper}

          **Alert:** #${number}
          **Rule:** \`${rule}\`
          **Location:** \`${file}:${line}\`

          ${description}

          [View alert](${html_url})

          "
            done < <(echo "$alerts" | jq -c '.[]')

            body="${body}---

          **Blocking findings:** ${blocking}
          **Warning findings:** ${warnings}

          "

            if [ "$blocking" -gt 0 ]; then
              body="${body}**Merge status:** ❌ **BLOCKED**

          At least one High/Critical finding was detected."
            else
              body="${body}**Merge status:** ✅ **NOT BLOCKED**

          No High/Critical findings were detected."
            fi
          fi

          echo "$body"

          gh issue comment \
            "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --body "$body"