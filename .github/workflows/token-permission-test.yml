name: Token permissions experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token-test:
    runs-on: ubuntu-latest

    steps:
      
      - name: Try to write repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/issues \
            -f title="Permission test"