name: PR code experiment

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect-pr-code:
    runs-on: ubuntu-latest

    steps:

      - name: Show event information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show checked out commit
        run: |
          git rev-parse HEAD
          git status

      - name: Show repository files
        run: |
          ls -la
      - name: Run PR script
        run: bash scripts/pr-test.sh