name: Report workflow security findings

on:
  workflow_run:
    workflows:
      - Workflow security review
    types:
      - completed

permissions: {}

jobs:
  report:
    name: Report Zizmor findings
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number != null

    permissions:
      security-events: read
      issues: write

    steps:
      - name: Report Zizmor findings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          echo "Reading Zizmor alerts for PR #${PR_NUMBER}..."

          alerts=$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GH_REPO}/code-scanning/alerts?pr=${PR_NUMBER}&tool_name=zizmor&state=open&per_page=100")

          count=$(echo "$alerts" | jq 'length')

          echo "Found ${count} open Zizmor alert(s)."

          body="## 🔐 Zizmor security review\n\n"

          if [ "$count" -eq 0 ]; then
            body="${body}No open Zizmor findings were detected for this pull request.\n\n"
            body="${body}**Merge status:** ✅ **NOT BLOCKED**"
          else
            blocking=0
            warnings=0

            while IFS= read -r finding; do
              number=$(echo "$finding" | jq -r '.number')
              rule=$(echo "$finding" | jq -r '.rule.id // .rule.name // "unknown"')
              severity=$(echo "$finding" | jq -r '.rule.severity // "unknown"')
              security_severity=$(echo "$finding" | jq -r '.rule.security_severity_level // ""')
              description=$(echo "$finding" | jq -r '.rule.description // "No description available."')
              file=$(echo "$finding" | jq -r '.most_recent_instance.location.path // "unknown"')
              line=$(echo "$finding" | jq -r '.most_recent_instance.location.start_line // "?"')
              html_url=$(echo "$finding" | jq -r '.html_url')

              severity_upper=$(echo "$severity" | tr '[:lower:]' '[:upper:]')
              security_severity_upper=$(echo "$security_severity" | tr '[:lower:]' '[:upper:]')

              if [ "$severity_upper" = "ERROR" ] ||
                 [ "$security_severity_upper" = "HIGH" ] ||
                 [ "$security_severity_upper" = "CRITICAL" ]; then

                status="🔴 BLOCKING — High+"
                blocking=$((blocking + 1))

              else

                status="🟡 WARNING — Medium/Low"
                warnings=$((warnings + 1))

              fi

              body="${body}### ${status}\n\n"
              body="${body}**Alert:** #${number}\n"
              body="${body}**Rule:** \`${rule}\`\n"
              body="${body}**Severity:** ${severity_upper}\n"
              body="${body}**Location:** \`${file}:${line}\`\n\n"
              body="${body}${description}\n\n"
              body="${body}[View alert](${html_url})\n\n"

            done < <(echo "$alerts" | jq -c '.[]')

            body="${body}---\n\n"
            body="${body}**Blocking findings:** ${blocking}\n"
            body="${body}**Warning findings:** ${warnings}\n\n"

            if [ "$blocking" -gt 0 ]; then
              body="${body}**Merge status:** ❌ **BLOCKED**\n\n"
              body="${body}At least one High/Critical finding was detected."
            else
              body="${body}**Merge status:** ✅ **NOT BLOCKED**\n\n"
              body="${body}No High/Critical findings were detected."
            fi
          fi

          echo "----- Comment body -----"
          printf '%b\n' "$body"
          echo "------------------------"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$body"